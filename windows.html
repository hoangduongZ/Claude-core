<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code trên máy Windows — minimal patch</title>
<style>
  html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#F1F0EB;color:#171A19}
  .loading{max-width:760px;margin:12vh auto;padding:28px;border:1px solid #D6D3CA;background:#FAF9F5}
  .loading h1{font-size:20px;margin:0 0 10px}.loading p{line-height:1.6;color:#5C605D}
  code{font-family:ui-monospace,monospace;background:#e7e6e0;padding:.1em .3em}
</style>
</head>
<body>
<div class="loading" id="loading">
  <h1>Đang nạp cấu trúc gốc…</h1>
  <p>File này giữ nguyên HTML/CSS/JavaScript của <code>windows.html</code> gốc và chỉ patch các đoạn liên quan Git Bash ↔ PowerShell.</p>
</div>
<script>
(async function(){
  const SOURCE = 'https://raw.githubusercontent.com/hoangduongz/Claude-core/main/windows.html';
  const SENTINEL = 'CLAUDE_WINDOWS_MINIMAL_PATCH_2026_09_15';
  try {
    const res = await fetch(SOURCE, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const html = await res.text();
    if(html.includes(SENTINEL)) throw new Error('Nguồn hiện tại đã trỏ vào chính file patch; cần dùng bản windows.html gốc làm source.');

    const doc = new DOMParser().parseFromString(html, 'text/html');

    function one(sel){ return doc.querySelector(sel); }
    function all(sel){ return Array.from(doc.querySelectorAll(sel)); }
    function setHTML(sel, value){ const e=one(sel); if(e) e.innerHTML=value; }
    function setText(sel, value){ const e=one(sel); if(e) e.textContent=value; }

    // ===== Minimal patch 1: TOC + section 02 =====
    const toc2 = one('.toc a[href="#s2"]');
    if(toc2) toc2.innerHTML = '<span>02</span>PowerShell &amp; Git Bash — hai đường shell';

    setText('#s2 h2', 'PowerShell & Git Bash — hai đường shell');
    setHTML('#s2 .naive q', 'Git for Windows có còn là điều kiện bắt buộc để Claude Code chạy lệnh trên Windows không?');
    setHTML('#s2 .analogy p', 'Hãy nghĩ Claude Code có <b>hai bộ dụng cụ shell</b> trên native Windows. Nếu không có Git Bash, Claude dùng <b>PowerShell tool</b>. Nếu cài Git for Windows, Claude có thêm <b>Bash tool</b> qua Git Bash; PowerShell vẫn có thể tồn tại song song. Terminal bạn dùng để mở <code>claude</code> không quyết định duy nhất tool shell mà model sẽ gọi.');

    const s2Top = one('#s2 .fig .top > span');
    if(s2Top) s2Top.textContent = 'Bấm để đổi giữa hai cấu hình native Windows';
    setText('#bridgeOn', 'Có Git Bash');
    setText('#bridgeOff', 'Không Git Bash');
    setText('#s2 #brT1', 'Bash tool · Git Bash');
    setText('#s2 #brT2', 'C:\\Program Files\\Git\\bin\\bash.exe');
    setHTML('#bridgeOut', '<span class="ok">$ php artisan test → Tests: 42 passed</span>');
    const s2Cap = one('#s2 .fig .cap');
    if(s2Cap) s2Cap.innerHTML = 'Không có Git Bash thì shell command <b>không rơi vào khoảng trống</b>: Claude Code dùng PowerShell tool. Có Git Bash thì Bash tool dùng <code>bash.exe</code>; PowerShell tool vẫn có thể dùng song song.';

    const s2Code = one('#s2 .code');
    if(s2Code){
      const hdr=s2Code.querySelector('header span');
      const pre=s2Code.querySelector('pre');
      if(hdr) hdr.textContent='PowerShell — Git Bash là optional';
      if(pre) pre.textContent = '# kiểm tra Git Bash nếu bạn muốn dùng Bash tool\nTest-Path "C:\\Program Files\\Git\\bin\\bash.exe"\n\n# chỉ cần set khi Claude không tự tìm được Git Bash\nsetx CLAUDE_CODE_GIT_BASH_PATH "C:\\Program Files\\Git\\bin\\bash.exe"\n\n# PowerShell tool: bật tường minh khi provider yêu cầu\nsetx CLAUDE_CODE_USE_POWERSHELL_TOOL "1"';
    }

    const s2DirectPs = all('#s2 > p');
    if(s2DirectPs[0]) s2DirectPs[0].innerHTML = 'Git for Windows hiện là <b>optional</b> trên native Windows. Không cài Git Bash thì Claude Code chạy shell command qua <code>PowerShell</code>. Khi Git Bash được cài, Bash tool dùng Git Bash; PowerShell tool có thể có mặt song song và khi bật sẽ được Claude xem là shell chính.';
    const s2Trap = one('#s2 .trap p');
    if(s2Trap) s2Trap.innerHTML = 'Đừng đồng nhất <b>terminal cha</b> với <b>shell tool</b>. Bạn có thể mở <code>claude</code> từ PowerShell nhưng model vẫn gọi Bash khi cần POSIX; hoặc không cài Git Bash và toàn bộ shell command đi qua PowerShell tool.';
    const s2Check = one('#s2 .check p');
    if(s2Check) s2Check.innerHTML = 'Chuyển hẳn sang WSL2 thì sao? <span class="ans">— Trong WSL bạn dùng môi trường Linux và Bash/Zsh như bình thường. Còn trên native Windows, Git Bash chỉ là cách cung cấp Bash tool, không còn là điều kiện để Claude chạy shell.</span>';

    // ===== Minimal patch 2: section 06 — only Bash-only claim =====
    const s6Trap = one('#s6 .trap p');
    if(s6Trap) s6Trap.innerHTML = 'Đoạn <code>!`git diff --stat`</code> không còn mặc định đồng nghĩa với Git Bash trong mọi cấu hình. Skill có thể khai báo <code>shell: powershell</code>; trên Windows không có Git Bash, PowerShell là đường shell sẵn có. Nếu workflow phụ thuộc cú pháp POSIX hay PowerShell, hãy chỉ định shell tường minh.';

    // ===== Minimal patch 3: section 07 — hook matcher/shell =====
    const s7Codes = all('#s7 .code');
    if(s7Codes.length >= 2){
      const settingsCode = s7Codes[1];
      const pre = settingsCode.querySelector('pre');
      if(pre) pre.textContent = `{
  "hooks": {
    "PreToolUse": [{
      "matcher": "Bash|PowerShell",
      "hooks": [{
        "type": "command",
        "shell": "powershell",
        "command": "& \\\"$env:CLAUDE_PROJECT_DIR\\\\.claude\\\\hooks\\\\gate-merge.ps1\\\"",
        "timeout": 10
      }]
    }]
  }
}`;
    }
    const s7Traps = all('#s7 .trap p');
    if(s7Traps[0]) s7Traps[0].innerHTML = 'Trên Windows hiện tại, command hook có thể chọn tường minh <code>"shell": "powershell"</code>. Nếu hook đang kiểm tra shell command của Claude, matcher nên bao phủ <code>Bash|PowerShell</code>; match riêng <code>Bash</code> sẽ không chạy trên máy PowerShell-only.';

    // ===== Minimal patch 4: section 08 — mirror permission examples =====
    const s8Code = one('#s8 .code pre');
    if(s8Code) s8Code.textContent = `{
  "permissions": {
    "allow": [
      "Bash(php artisan test:*)", "PowerShell(php artisan test:*)",
      "Bash(./vendor/bin/pint:*)", "PowerShell(./vendor/bin/pint:*)",
      "Bash(composer install)", "PowerShell(composer install)",
      "Read(./**)"
    ],
    "deny": [
      "Bash(php artisan migrate:fresh:*)", "PowerShell(php artisan migrate:fresh:*)",
      "Bash(git push --force:*)", "PowerShell(git push --force:*)",
      "Read(./.env)"
    ],
    "ask": [
      "Bash(git push:*)", "PowerShell(git push:*)"
    ],
    "defaultMode": "default"
  }
}`;
    const s8Check = one('#s8 .check p');
    if(s8Check) s8Check.innerHTML = 'Thêm <code>"Read(./.env)"</code> vào <code>deny</code> có ngăn Claude đọc file đó qua shell không? <span class="ans">— Không hiển nhiên. <code>Read</code>, <code>Bash</code> và <code>PowerShell</code> là các tool khác nhau; nếu muốn policy kín theo hành vi, phải xét cả đường shell tương ứng.</span>';

    // ===== Minimal patch 5: section 13 diagnostics =====
    const s13Pre = one('#s13 .code pre');
    if(s13Pre){
      s13Pre.innerHTML = s13Pre.innerHTML
        .replace('# 2 — chẩn đoán PATH, Git Bash, quyền  (quan trọng nhất)', '# 2 — chẩn đoán PATH, shell tool, quyền  (quan trọng nhất)')
        .replace('# 8 — Git Bash mà Claude sẽ dùng', '# 8 — Git Bash nếu Bash tool có mặt')
        .replace('Get-Command bash -ErrorAction SilentlyContinue | Select-Object Source', 'Get-Command bash -ErrorAction SilentlyContinue | Select-Object Source\n\n<span class="c"># 8b — PowerShell native mà Claude có thể dùng</span>\nGet-Command pwsh -ErrorAction SilentlyContinue | Select-Object Source\nGet-Command powershell -ErrorAction SilentlyContinue | Select-Object Source');
    }

    // ===== Minimal patch 6: section 14 quick reference =====
    const bashRow = all('#s14 table tr').find(tr => tr.textContent.includes('CLAUDE_CODE_GIT_BASH_PATH'));
    if(bashRow){
      const cells=bashRow.querySelectorAll('td');
      if(cells[2]) cells[2].textContent='Trỏ tới bash.exe khi muốn dùng Bash tool và Claude không tự tìm được Git Bash.';
      const tr=doc.createElement('tr');
      tr.setAttribute('data-conf','d');
      tr.innerHTML='<td class="m">CLAUDE_CODE_USE_POWERSHELL_TOOL</td><td class="s">env</td><td class="s">Bật PowerShell tool tường minh khi provider/account cần; trên Windows không có Git Bash thì PowerShell được bật tự động.</td>';
      bashRow.after(tr);
    }

    // Keep original scripts, then add a tiny override only for the old bridge widget behavior.
    const patchScript = doc.createElement('script');
    patchScript.textContent = `/* ${SENTINEL} */
(function(){
  function applyBridge(hasGit){
    var t1=document.getElementById('brT1'), t2=document.getElementById('brT2');
    var rect=document.getElementById('brRect'), gap=document.getElementById('gapT');
    var bl=document.getElementById('bl'), br=document.getElementById('br');
    var out=document.getElementById('bridgeOut');
    if(!t1||!out)return;
    if(hasGit){
      t1.textContent='Bash tool · Git Bash';
      if(t2)t2.textContent='C:\\\\Program Files\\\\Git\\\\bin\\\\bash.exe';
      if(rect){rect.setAttribute('fill','rgba(31,107,87,.12)');rect.setAttribute('stroke','#1F6B57');}
      if(gap)gap.setAttribute('opacity','0');
      if(bl){bl.setAttribute('stroke','#1F6B57');bl.setAttribute('opacity','1');}
      if(br){br.setAttribute('stroke','#1F6B57');br.setAttribute('opacity','1');}
      out.innerHTML='<span class="ok">$ php artisan test → Tests: 42 passed</span>';
    }else{
      t1.textContent='PowerShell tool';
      if(t2)t2.textContent='pwsh.exe / powershell.exe';
      if(rect){rect.setAttribute('fill','rgba(74,110,147,.10)');rect.setAttribute('stroke','#4A6E93');}
      if(gap){gap.textContent='không có Git Bash → dùng PowerShell tool';gap.setAttribute('opacity','1');}
      if(bl){bl.setAttribute('stroke','#4A6E93');bl.setAttribute('opacity','1');}
      if(br){br.setAttribute('stroke','#4A6E93');br.setAttribute('opacity','1');}
      out.innerHTML='<span class="ok">PS&gt; php artisan test → Tests: 42 passed</span>';
    }
  }
  var on=document.getElementById('bridgeOn'), off=document.getElementById('bridgeOff');
  if(on)on.addEventListener('click',function(){setTimeout(function(){applyBridge(true)},0)});
  if(off)off.addEventListener('click',function(){setTimeout(function(){applyBridge(false)},0)});
  setTimeout(function(){applyBridge(true); if(location.hash){var e=document.querySelector(location.hash);if(e)e.scrollIntoView();}},0);
})();`;
    doc.body.appendChild(patchScript);

    // Keep all original structure/assets; only add a base so relative links resolve when this file is opened locally.
    let base = doc.querySelector('base');
    if(!base){ base = doc.createElement('base'); doc.head.prepend(base); }
    base.href = 'https://hoangduongz.github.io/Claude-core/';

    const output='<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
    document.open();
    document.write(output);
    document.close();
  } catch(err){
    document.getElementById('loading').innerHTML='<h1>Không nạp được source gốc</h1><p>'+String(err.message||err)+'</p><p>Source: <code>'+SOURCE+'</code></p>';
  }
})();
</script>
</body>
</html>
